name: Bug report
description: Report a reproducible problem.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'For vulnerabilities, use private security reporting. Do not include credentials or private targets.'
  - type: input
    id: version
    attributes:
      label: Revision or version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Platform, database and execution mode
      placeholder: Windows / SQLite / E2B
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
