version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directories: [/web, /adapters/agent, /adapters/e2b, /skills/api-recon/scripts]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
