name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Source and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node tools/check-repository.mjs
      - run: node tools/validate-landing.mjs
      - name: Syntax checks
        run: |
          for script in *.sh tools/ci/*.sh; do bash -n "$script"; done
          sh -n start.sh
          node --check landing/assets/js/app.js
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:static
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-preview
          path: web/out
          if-no-files-found: error
          retention-days: 7
  adapters:
    name: Adapter / ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        adapter: [agent, e2b]
    defaults:
      run:
        working-directory: adapters/${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adapters/${{ matrix.adapter }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - if: matrix.adapter == 'agent'
        run: npm run check
  backend:
    name: Backend / PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blacksand_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blacksand_test -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix adapters/agent
      - name: Unit and integration tests in disposable databases
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: blacksand_test
          PGPASSWORD: test_only_password
          BLACKSAND_ADAPTER_E2E: '1'
        run: bash tools/ci/test-backend.sh
