services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blacksand}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-blacksand}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blacksand} -d ${POSTGRES_DB:-blacksand}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  blacksand:
    build:
      context: .
    image: blacksand:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BLACKSAND_LANGUAGE: ${BLACKSAND_LANGUAGE:-en}
      BLACKSAND_PG_DSN: postgres://${POSTGRES_USER:-blacksand}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blacksand}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BLACKSAND_LLM_PROVIDER: ${BLACKSAND_LLM_PROVIDER:-}
      BLACKSAND_LLM_MODEL: ${BLACKSAND_LLM_MODEL:-}
      BLACKSAND_LLM_BASE_URL: ${BLACKSAND_LLM_BASE_URL:-}
      BLACKSAND_LLM_PROXY: ${BLACKSAND_LLM_PROXY:-}
      BLACKSAND_EXECUTION: ${BLACKSAND_EXECUTION:-local}
      E2B_API_KEY: ${E2B_API_KEY:-}
      BLACKSAND_E2B_TEMPLATE: ${BLACKSAND_E2B_TEMPLATE:-base}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
